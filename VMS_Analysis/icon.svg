<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F5278"/>
      <stop offset="1" stop-color="#062B44"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3BF"/>
      <stop offset="0.22" stop-color="#FFC247"/>
      <stop offset="0.55" stop-color="#F26B3A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#F26B3A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="128" height="128" rx="24"/></clipPath>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#sea)"/>

  <g clip-path="url(#tile)">
    <!-- kernel density glow -->
    <circle cx="82" cy="46" r="44" fill="url(#heat)"/>

  </g>

  <!-- track line -->
  <path d="M44 70 L54 66 L60 63 L68 61 L72 52 L80 50 L84 44 L92 46"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="2 3" stroke-linecap="round"/>

  <!-- track points (denser near the hotspot) -->
  <g fill="#FFFFFF" stroke="#0A3550" stroke-width="0.9">
    <circle cx="54" cy="66" r="2.6"/>
    <circle cx="60" cy="63" r="2.6"/>
    <circle cx="68" cy="61" r="2.6"/>
    <circle cx="72" cy="52" r="2.6"/>
    <circle cx="80" cy="50" r="2.6"/>
    <circle cx="84" cy="44" r="2.6"/>
    <circle cx="92" cy="46" r="2.6"/>
    <circle cx="88" cy="38" r="2.6"/>
    <circle cx="79" cy="38" r="2.6"/>
    <circle cx="90" cy="54" r="2.6"/>
    <circle cx="76" cy="60" r="2.6"/>
    <circle cx="97" cy="40" r="2.6"/>
  </g>

  <!-- outrigger (cadik) fishing boat -->
  <g fill="#F4F8FA">
    <path d="M14 90 H66 Q62 102 49 102 H30 Q18 102 14 90 Z"/>
    <rect x="38" y="80" width="12" height="10" rx="1.5"/>
    <ellipse cx="40" cy="105" rx="29" ry="3"/>
  </g>
  <g stroke="#F4F8FA" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M24 96 L24 104"/>
    <path d="M58 96 L58 104"/>
    <path d="M44 80 L44 73"/>
  </g>

  <!-- water overlay: hull and float sit in the sea -->
  <g clip-path="url(#tile)">
    <path d="M-4 106 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 V132 H-4 Z" fill="#073B60" fill-opacity="0.93"/>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2.2" stroke-linecap="round">
      <path d="M-4 106 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" stroke-opacity="0.45"/>
      <path d="M-4 118 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
    </g>
  </g>

  <!-- tracker beacon + signal -->
  <circle cx="44" cy="70.5" r="2.8" fill="#FFC247" stroke="#0A3550" stroke-width="0.9"/>
  <g fill="none" stroke="#FFC247" stroke-width="1.8" stroke-linecap="round">
    <path d="M36 66 Q33 70.5 36 75"/>
    <path d="M31 63 Q26 70.5 31 78" stroke-opacity="0.6"/>
  </g>
</svg>
